<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="JSAN supports global mapping, mobility, telecom and infrastructure programs &#8212; from field mobilisation and data collection through engineering, GeoAI, quality assurance and managed operations." />
    <meta name="keywords" content="geospatial services, field operations, data collection, GeoAI, mapping, mobility, telecom, infrastructure, digital engineering, managed operations, GIS" />
    <meta property="og:title" content="JSAN | Real-World Operations. Spatial Intelligence. Digital Engineering." />
    <meta property="og:description" content="Supporting global mapping, mobility, telecom and infrastructure programs from field mobilisation and data collection through engineering, GeoAI, quality assurance and managed operations." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.jsanconsulting.com" />
    <meta property="og:site_name" content="JSAN" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <title>JSAN | Global Geospatial, Field Operations &amp; Technology Partner</title>
    <!-- GTranslate Settings -->
    <script>
      window.gtranslateSettings = {
        "default_language": "en",
        "languages": ["en","fr","it","es","de","pt","nl","pl","sv","da","no","fi","el","cs","ro","hu","bg","hr","sk","sl","et","lv","lt","ga","mt"],
        "wrapper_selector": ".gtranslate_wrapper",
        "flag_size": 20,
        "switcher_horizontal_position": "left"
      };
    </script>
    <script src="https://cdn.gtranslate.net/widgets/latest/dwf.js" defer></script>
    <!-- Elfsight Platform -->
    <script src="https://static.elfsight.com/platform/platform.js" defer></script>
  </head>
  <body>
    <div id="root"></div>
    <div class="gtranslate_wrapper"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Force-hide Elfsight branding without removing from DOM
      new MutationObserver(function() {
        document.querySelectorAll('a[href*="elfsight.com"]').forEach(function(el) {
          el.style.setProperty('display', 'none', 'important');
          el.style.setProperty('visibility', 'hidden', 'important');
          el.style.setProperty('height', '0', 'important');
          el.style.setProperty('width', '0', 'important');
          el.style.setProperty('overflow', 'hidden', 'important');
          el.style.setProperty('padding', '0', 'important');
          el.style.setProperty('margin', '0', 'important');
          el.style.setProperty('opacity', '0', 'important');
          el.style.setProperty('pointer-events', 'none', 'important');
          el.style.setProperty('position', 'absolute', 'important');
          el.style.setProperty('clip', 'rect(0,0,0,0)', 'important');
        });
      }).observe(document.body, { childList: true, subtree: true });
    </script>
  </body>
</html>
