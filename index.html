<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=jsan-logo-2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Discover the homepage hero before the React route has downloaded.
      if (location.pathname === '/') {
        const hero = document.createElement('link');
        hero.rel = 'preload';
        hero.as = 'image';
        hero.href = '/pillars/homepage.webp';
        hero.imageSrcset = '/pillars/homepage-960.webp 960w, /pillars/homepage.webp 1916w';
        hero.imageSizes = '100vw';
        hero.fetchPriority = 'high';
        document.head.appendChild(hero);
      }
    </script>
    <meta name="description" content="JSAN supports global mapping, mobility, telecom and infrastructure programs &#8212; from field mobilisation and data collection through engineering, GeoAI, quality assurance and managed operations." />
    <meta name="keywords" content="geospatial services, field operations, data collection, GeoAI, mapping, mobility, telecom, infrastructure, digital engineering, managed operations, GIS" />
    <!-- Homepage defaults. Every route overrides title, description and these social tags
         at runtime from src/data/page-meta.json (see src/components/Seo.tsx). -->
    <link rel="canonical" href="https://www.jsanconsulting.com" />
    <meta property="og:title" content="JSAN | Global Geospatial, Field Operations &amp; Technology Partner" />
    <meta property="og:description" content="JSAN supports global mapping, mobility, telecom and infrastructure programs &#8212; from field mobilisation and data collection through engineering, GeoAI, quality assurance and managed operations." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.jsanconsulting.com" />
    <meta property="og:site_name" content="JSAN" />
    <meta property="og:image" content="https://www.jsanconsulting.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="JSAN | Global Geospatial, Field Operations &amp; Technology Partner" />
    <meta name="twitter:description" content="JSAN supports global mapping, mobility, telecom and infrastructure programs &#8212; from field mobilisation and data collection through engineering, GeoAI, quality assurance and managed operations." />
    <meta name="twitter:image" content="https://www.jsanconsulting.com/og-image.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <title>JSAN | Global Geospatial, Field Operations &amp; Technology Partner</title>
    <!-- GTranslate Settings -->
    <script>
      window.gtranslateSettings = {
        "default_language": "en",
        "languages": ["en","fr","it","es","de","pt","nl","pl","sv","da","no","fi","el","cs","ro","hu","bg","hr","sk","sl","et","lv","lt","ga","mt"],
        "wrapper_selector": ".gtranslate_wrapper",
        "flag_size": 20,
        "switcher_horizontal_position": "left"
      };
    </script>
    <script src="https://cdn.gtranslate.net/widgets/latest/dwf.js" defer></script>
  </head>
  <body>
    <div id="root"></div>
    <div class="gtranslate_wrapper"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
